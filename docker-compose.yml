# Crypta server: the core (Go) plus optional pieces.
#
#   docker compose up -d                         core only
#   docker compose --profile telegram up -d      + Telegram bot
#   docker compose --profile telegram --profile telegram-bot-api up -d
#                                                + own Bot API server (files up to 2 GB)
#   docker compose --profile https up -d         + Caddy with automatic HTTPS
#
# Settings come from .env (copy .env.example).
services:
  core:
    build: ./core
    restart: unless-stopped
    environment:
      CRYPTA_PUBLIC_URL: ${CRYPTA_PUBLIC_URL:-}
      CRYPTA_REMOTE: ${CRYPTA_REMOTE:-}
      CRYPTA_DEMO: ${CRYPTA_DEMO:-}
      CRYPTA_ALLOW_PRIVATE_URLS: ${CRYPTA_ALLOW_PRIVATE_URLS:-}
      CRYPTA_UPLOAD_PARALLEL: ${CRYPTA_UPLOAD_PARALLEL:-}
      PIKPAK_USERNAME: ${PIKPAK_USERNAME:-}
      PIKPAK_PASSWORD: ${PIKPAK_PASSWORD:-}
      PIKPAK_PROXY: ${PIKPAK_PROXY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${RCLONE_CONF:-./rclone.conf}:/config/rclone.conf:ro
      - crypta-data:/data
      - crypta-downloads:/downloads
      # The files the Bot API server fetched, uploaded from where they are.
      - telegram-bot-api:/downloads/telegram-bot-api
    ports:
      - "${CRYPTA_BIND:-127.0.0.1:8080}:8080"

  telegram:
    profiles: ["telegram"]
    build: ./plugins/telegram
    restart: unless-stopped
    depends_on: [core]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_REMOTE_DIR: ${TELEGRAM_REMOTE_DIR:-Telegram}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_LOCAL_MODE: ${TELEGRAM_LOCAL_MODE:-}
      TELEGRAM_API_SHARE: telegram-bot-api
      TZ: ${TZ:-UTC}
    volumes:
      - crypta-data:/data:ro
      - crypta-downloads:/downloads
      # A local Bot API server hands the bot paths inside its data folder;
      # writable, because the bot moves each file to where the core takes it.
      - telegram-bot-api:/var/lib/telegram-bot-api

  # Self-hosted Bot API server: lifts the bot's download limit from 20 MB to
  # 2 GB. Set TELEGRAM_API_BASE=http://telegram-bot-api:8081 and
  # TELEGRAM_LOCAL_MODE=1 with it.
  telegram-bot-api:
    profiles: ["telegram-bot-api"]
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api:/var/lib/telegram-bot-api

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [core]
    command: caddy reverse-proxy --from ${CRYPTA_DOMAIN:-localhost} --to core:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  crypta-data:
  crypta-downloads:
  telegram-bot-api:
  caddy-data:
